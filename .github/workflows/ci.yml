name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lit la version depuis `.fvmrc` plutôt qu'un `channel: stable` en
      # dur : la CI suivait sa propre résolution du canal "stable",
      # potentiellement différente de celle utilisée en local via FVM au
      # même moment — risque de divergence d'analyse/tests (audit du
      # 2026-08-19, issue #71 point 1.6). `.fvmrc` pointe lui-même
      # encore sur le canal flottant `"stable"` (pas une version figée,
      # décision encore en suspens côté Gaelle) : ce changement ne fixe
      # donc pas la reproductibilité à 100 % tout de suite, mais fait
      # que la CI suivra automatiquement `.fvmrc` sans reprise si/quand
      # il est un jour épinglé à une version exacte.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      # Fichiers générés (`*.g.dart` : Drift, riverpod_generator) à jour
      # avec le code source — audit du 2026-08-19, issue #71 point 3.9 :
      # rien n'empêchait jusqu'ici de committer un changement de schéma/
      # provider sans relancer `build_runner`, avec un `.g.dart` périmé
      # qui compile quand même (juste plus en phase avec ce qu'il est
      # censé générer) jusqu'à ce que ça casse ailleurs, plus tard.
      - name: Fichiers générés à jour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'

      # Même principe pour les traductions générées (`flutter gen-l10n`,
      # audit du 2026-08-19 issue #71 point 3.3) — `flutter pub get`
      # ci-dessus les régénère déjà (`generate: true` dans pubspec.yaml),
      # cette étape vérifie juste qu'un `.arb` modifié n'a pas été
      # committé sans régénérer `lib/l10n/generated/`.
      - name: Traductions générées à jour
        run: git diff --exit-code -- 'lib/l10n/generated/*.dart'

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      # `--fatal-infos` : une info (pas seulement warning/error) fait
      # aussi échouer la CI — audit du 2026-08-19, issue #71 point 3.8.
      - name: Analyse statique
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test --coverage

      - name: Publier la couverture de tests
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

      # Détecte les régressions que `flutter analyze`/`flutter test` ne
      # voient pas (config Gradle/manifest Android cassée...) — audit du
      # 2026-08-19, issue #71 point 3.8. Debug, pas release : pas de
      # signature nécessaire (voir `build.gradle.kts` — la release exige
      # `android/key.properties`, un secret non présent en CI et qui ne
      # doit pas l'être).
      - name: Build APK debug
        run: flutter build apk --debug
